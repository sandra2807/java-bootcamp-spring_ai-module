spring:
  application:
    name: springai-bootcamp-demo
  ai:
    model:
      chat: ollama
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Starting the application must never download a model or require Ollama.
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_MODEL:gemma3:1b}
        temperature: 0.3
    retry:
      # Fail promptly when the local server is unavailable.
      max-attempts: 1
  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:chatbot.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
